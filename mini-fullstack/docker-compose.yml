version: "3.9"

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mini
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://db:3306/mini?useSSL=false&serverTimezone=Asia/Shanghai
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-dev-only-please-replace-me-with-32-bytes-min}
      ADMIN_USER: ${ADMIN_USER:-demo}
      ADMIN_PASS: ${ADMIN_PASS:-123456}
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db:
  uploads:
