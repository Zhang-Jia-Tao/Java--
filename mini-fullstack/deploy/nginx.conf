# 非容器部署（宿主机直接跑 Nginx）用这份；容器版见 frontend/nginx.conf
#
# 三个关键点：
# 1) try_files 回落：SPA 只有 index.html 一个入口，否则刷新 /tasks 直接 404
# 2) 缓存策略：带 hash 的 assets 长缓存，index.html 必须 no-cache
# 3) /api/ 反代：proxy_pass 末尾斜杠要与 location 一一对应，少一个斜杠路径就串了

server {
    listen       80;
    server_name  localhost;

    root  /var/www/mini-fullstack;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端接口
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 上传文件直接由 Nginx 出，别让 Java 再读一遍磁盘
    location /uploads/ {
        alias      /var/www/mini-uploads/;
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # 带内容 hash 的静态资源：一年 + immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 入口必须每次校验，否则用户永远拿不到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回落
    location / {
        try_files $uri $uri/ /index.html;
    }
}
