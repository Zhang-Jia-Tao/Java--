<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img">
<rect width="720" height="388" fill="#fbf9f5"/>
<text x="360" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2f2a26" text-anchor="middle" font-weight="600">击穿时序：同一 key 只有一个线程查库</text>
<rect x="60" y="52" width="600" height="34" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="52" width="3" height="34" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">1. 线程 A、B、C 同时未命中缓存</text>
<line x1="360" y1="88" x2="360" y2="102" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 101 L364 101 L360 108" fill="#8a8177"/>
<rect x="60" y="112" width="600" height="34" rx="8" fill="#ffffff" stroke="#3d6b8c" stroke-width="1"/>
<rect x="60" y="112" width="3" height="34" rx="1.5" fill="#3d6b8c" stroke="none" stroke-width="1"/>
<text x="78" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">2. 三者都尝试 lock.lock()</text>
<line x1="360" y1="148" x2="360" y2="162" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 161 L364 161 L360 168" fill="#8a8177"/>
<rect x="60" y="172" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="172" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">3. A 拿到锁 → 锁内再判空值缓存与 Hash</text>
<text x="78" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">双重判定</text>
<line x1="360" y1="227" x2="360" y2="241" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 240 L364 240 L360 247" fill="#8a8177"/>
<rect x="60" y="251" width="600" height="34" rx="8" fill="#ffffff" stroke="#5b7f5a" stroke-width="1"/>
<rect x="60" y="251" width="3" height="34" rx="1.5" fill="#5b7f5a" stroke="none" stroke-width="1"/>
<text x="78" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. A 查库并 Lua 回填 → 释放锁</text>
<line x1="360" y1="287" x2="360" y2="301" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 300 L364 300 L360 307" fill="#8a8177"/>
<rect x="60" y="311" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="311" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">5. B、C 依次拿锁后判定已回填 → 直接读缓存返回</text>
<text x="78" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">回源次数 = 1</text>
</svg>
