<rect x="60" y="304" width="3" height="68" rx="1.5" fill="#5b7f5a" stroke="none" stroke-width="1"/>
<text x="78" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. report 出报告</text>
<text x="78" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">report.md 一页纸 + per_sample.csv 明细 + fail</text>
<text x="78" y="359" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">ures.jsonl 归因 + slides.html</text>
