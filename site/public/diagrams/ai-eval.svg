<text x="78" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">意图 Top-1、Recall@K（must/nice）、TTFT/P50；抽样</text>
<text x="78" y="265" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400"> 5 条跑 RAGAS</text>
<line x1="360" y1="280" x2="360" y2="294" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 293 L364 293 L360 300" fill="#8a8177"/>
