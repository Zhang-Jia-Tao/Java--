<rect x="60" y="240" width="3" height="34" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. 搜索/列表 → ES 全分片并行 → 返回 page</text>
<line x1="360" y1="276" x2="360" y2="290" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 289 L364 289 L360 296" fill="#8a8177"/>
<rect x="60" y="300" width="600" height="34" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="300" width="3" height="34" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">5. 运营跨店 → 产品限制最大页码，不做深翻</text>
