<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img">
<rect width="720" height="460" fill="#fbf9f5"/>
<text x="360" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2f2a26" text-anchor="middle" font-weight="600">MCP 工具调用：从意图命中到结果回填</text>
<rect x="60" y="52" width="600" height="53" rx="8" fill="#ffffff" stroke="#3d6b8c" stroke-width="1"/>
<rect x="60" y="52" width="3" height="53" rx="1.5" fill="#3d6b8c" stroke="none" stroke-width="1"/>
<text x="78" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">1. 意图分流</text>
<text x="78" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">节点类型决定走 KB 检索还是 MCP 工具</text>
<line x1="360" y1="107" x2="360" y2="121" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 120 L364 120 L360 127" fill="#8a8177"/>
<rect x="60" y="131" width="600" height="68" rx="8" fill="#ffffff" stroke="#3d6b8c" stroke-width="1"/>
<rect x="60" y="131" width="3" height="68" rx="1.5" fill="#3d6b8c" stroke="none" stroke-width="1"/>
<text x="78" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">2. 工具注册表查表</text>
<text x="78" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">mcpToolId → ToolDefinition（名称/描述/参数 Sche</text>
<text x="78" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">ma）</text>
<line x1="360" y1="201" x2="360" y2="215" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 214 L364 214 L360 221" fill="#8a8177"/>
<rect x="60" y="225" width="600" height="53" rx="8" fill="#ffffff" stroke="#c2452d" stroke-width="1"/>
<rect x="60" y="225" width="3" height="53" rx="1.5" fill="#c2452d" stroke="none" stroke-width="1"/>
<text x="78" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">3. 参数提取</text>
<text x="78" y="265" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">LLM 按 Schema 抽参数，缺参/类型错走三级降级</text>
<line x1="360" y1="280" x2="360" y2="294" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 293 L364 293 L360 300" fill="#8a8177"/>
<rect x="60" y="304" width="600" height="53" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1"/>
<rect x="60" y="304" width="3" height="53" rx="1.5" fill="#b8860b" stroke="none" stroke-width="1"/>
<text x="78" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. 执行器调用</text>
<text x="78" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">查类工具直接读库；写类工具先返回待确认</text>
<line x1="360" y1="359" x2="360" y2="373" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 372 L364 372 L360 379" fill="#8a8177"/>
<rect x="60" y="383" width="600" height="53" rx="8" fill="#ffffff" stroke="#5b7f5a" stroke-width="1"/>
<rect x="60" y="383" width="3" height="53" rx="1.5" fill="#5b7f5a" stroke="none" stroke-width="1"/>
<text x="78" y="405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">5. 结果回填 Prompt</text>
<text x="78" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">工具结果作为结构化片段拼进 user 消息，附来源标记</text>
</svg>
