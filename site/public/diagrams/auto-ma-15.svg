<text x="78" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">3. 任务改期/取消 → 改库即可，扫描时按状态过滤</text>
