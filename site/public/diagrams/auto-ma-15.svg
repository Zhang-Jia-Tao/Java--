<text x="78" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">2. XXL-Job 定时扫描到点任务 → @XxlJob 触发</text>
<line x1="360" y1="120" x2="360" y2="134" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 133 L364 133 L360 140" fill="#8a8177"/>
