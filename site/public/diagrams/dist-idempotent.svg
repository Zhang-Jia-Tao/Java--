<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img">
<rect width="720" height="388" fill="#fbf9f5"/>
<text x="360" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2f2a26" text-anchor="middle" font-weight="600">分发消费幂等：状态机 + 时间窗</text>
<rect x="60" y="52" width="600" height="34" rx="8" fill="#ffffff" stroke="#3d6b8c" stroke-width="1"/>
<rect x="60" y="52" width="3" height="34" rx="1.5" fill="#3d6b8c" stroke="none" stroke-width="1"/>
<text x="78" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">1. 消费到消息（taskId + batchKey）</text>
<line x1="360" y1="88" x2="360" y2="102" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 101 L364 101 L360 108" fill="#8a8177"/>
<rect x="60" y="112" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="112" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">2. SETNX 抢占处理权</text>
<text x="78" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">拿不到说明已被处理/正在处理</text>
<line x1="360" y1="167" x2="360" y2="181" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 180 L364 180 L360 187" fill="#8a8177"/>
<rect x="60" y="191" width="600" height="34" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1"/>
<rect x="60" y="191" width="3" height="34" rx="1.5" fill="#b8860b" stroke="none" stroke-width="1"/>
<text x="78" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">3. 置为处理中，落库</text>
<line x1="360" y1="227" x2="360" y2="241" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 240 L364 240 L360 247" fill="#8a8177"/>
<rect x="60" y="251" width="600" height="34" rx="8" fill="#ffffff" stroke="#5b7f5a" stroke-width="1"/>
<rect x="60" y="251" width="3" height="34" rx="1.5" fill="#5b7f5a" stroke="none" stroke-width="1"/>
<text x="78" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. 处理成功 → 置为已完成</text>
<line x1="360" y1="287" x2="360" y2="301" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 300 L364 300 L360 307" fill="#8a8177"/>
<rect x="60" y="311" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="311" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">5. 失败 → 释放标记，允许重试</text>
<text x="78" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">避免死锁式卡在处理中</text>
</svg>
