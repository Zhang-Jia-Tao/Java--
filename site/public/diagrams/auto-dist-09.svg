<text x="78" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">1. 读阶段库存耗尽 → 写失败表 cause=优惠券模板无库存</text>
<line x1="360" y1="60" x2="360" y2="74" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 73 L364 73 L360 80" fill="#8a8177"/>
