<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" role="img">
<rect width="720" height="407" fill="#fbf9f5"/>
<text x="360" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2f2a26" text-anchor="middle" font-weight="600">批量查模板：按店分组 → 手动路由到库 → 合并</text>
<rect x="60" y="52" width="600" height="34" rx="8" fill="#ffffff" stroke="#3d6b8c" stroke-width="1"/>
<rect x="60" y="52" width="3" height="34" rx="1.5" fill="#3d6b8c" stroke="none" stroke-width="1"/>
<text x="78" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">1. 入参 ids + shopNumber 列表</text>
<line x1="360" y1="88" x2="360" y2="102" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 101 L364 101 L360 108" fill="#8a8177"/>
<rect x="60" y="112" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="112" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">2. 按 shopNumber 分组</text>
<text x="78" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">同一店铺的数据一定同库</text>
<line x1="360" y1="167" x2="360" y2="181" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 180 L364 180 L360 187" fill="#8a8177"/>
<rect x="60" y="191" width="600" height="53" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1"/>
<rect x="60" y="191" width="3" height="53" rx="1.5" fill="#b8860b" stroke="none" stroke-width="1"/>
<text x="78" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">3. splitIndexByDatabase：算库下标</text>
<text x="78" y="231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">避免全路由扫描 32 张表</text>
<line x1="360" y1="246" x2="360" y2="260" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 259 L364 259 L360 266" fill="#8a8177"/>
<rect x="60" y="270" width="600" height="53" rx="8" fill="#ffffff" stroke="#e2ddd4" stroke-width="1"/>
<rect x="60" y="270" width="3" height="53" rx="1.5" fill="#2f2a26" stroke="none" stroke-width="1"/>
<text x="78" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">4. 逐库执行 IN 查询</text>
<text x="78" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8a8177" text-anchor="start" font-weight="400">每库一次 SQL，而不是 32 次</text>
<line x1="360" y1="325" x2="360" y2="339" stroke="#8a8177" stroke-width="1.2"/>
<path d="M356 338 L364 338 L360 345" fill="#8a8177"/>
<rect x="60" y="349" width="600" height="34" rx="8" fill="#ffffff" stroke="#5b7f5a" stroke-width="1"/>
<rect x="60" y="349" width="3" height="34" rx="1.5" fill="#5b7f5a" stroke="none" stroke-width="1"/>
<text x="78" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f2a26" text-anchor="start" font-weight="500">5. 合并结果并按 id 排序返回</text>
</svg>
